<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerPacer Dashboard</title>
<link rel="icon" type="image/png" href="assets/careerpacer-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #f7f7f8;
    --color-surface: #ffffff;
    --color-border: #dcdcdf;
    --color-text: #1c1c1e;
    --color-muted: #6b6b70;
    --color-accent: #2a5adf;
    --color-warning-bg: #fff4e5;
    --color-warning-border: #f0b429;
    --color-not_started: #8a8a8e;
    --color-in_progress: #2a5adf;
    --color-done: #2f9e44;
    --color-blocked: #d64545;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 16px;
    --space-4: 24px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;
    background: var(--color-bg);
    color: var(--color-text);
  }

  .band {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }

  .page-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 var(--space-4);
  }

  .page-inner.wide {
    max-width: 1300px;
  }

  header {
    padding: var(--space-3) 0;
  }

  header .page-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .header-brand img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
  }

  .refresh-button {
    display: inline-block;
    padding: var(--space-2) var(--space-3);
    background: var(--color-accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
  }

  #load-status {
    margin-left: var(--space-3);
    font-size: 0.85rem;
    color: var(--color-muted);
  }

  .profile-header {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.8rem;
    color: var(--color-muted);
    margin-bottom: var(--space-3);
  }

  .profile-row {
    line-height: 1.3;
  }

  .profile-label {
    font-weight: 600;
    color: var(--color-muted);
  }

  nav.tabs {
    padding: var(--space-3) 0 0;
  }

  nav.tabs .page-inner {
    display: flex;
    gap: var(--space-2);
  }

  .tab-btn {
    border: none;
    background: transparent;
    padding: var(--space-2) var(--space-3);
    font-size: 0.95rem;
    color: var(--color-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--color-accent);
    border-bottom-color: var(--color-accent);
    font-weight: 600;
  }

  main {
    padding: var(--space-4) 0;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: var(--space-3);
    margin-bottom: var(--space-3);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 180px));
    gap: var(--space-3);
  }

  .overview-section {
    margin-bottom: var(--space-4);
  }

  .overview-section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-muted);
    margin: 0 0 var(--space-2);
  }

  .recent-progress-list {
    margin: 0;
    padding-left: var(--space-4);
    font-size: 0.88rem;
  }

  .recent-progress-list li {
    margin-bottom: var(--space-1);
  }

  .entry-date-inline {
    font-weight: 600;
    color: var(--color-muted);
  }

  .stat-box {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: var(--space-3);
    text-align: center;
  }

  .stat-box.status-accent {
    border-left: 4px solid var(--column-color, var(--color-border));
  }

  .stat-box .value {
    font-size: 1.35rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .stat-box .label {
    font-size: 0.8rem;
    color: var(--color-muted);
    margin-top: var(--space-1);
  }

  .tab-intro {
    margin-bottom: var(--space-3);
  }

  .tab-intro h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 var(--space-1);
  }

  .tab-subtitle {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-muted);
  }

  .warning-box {
    background: var(--color-warning-bg);
    border: 1px solid var(--color-warning-border);
    border-radius: 8px;
    padding: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .warning-box h3 {
    margin: 0 0 var(--space-2);
    font-size: 0.95rem;
  }

  .warning-box ul {
    margin: 0;
    padding-left: var(--space-4);
    font-size: 0.85rem;
    color: var(--color-muted);
  }

  .empty-state {
    color: var(--color-muted);
    font-size: 0.9rem;
    padding: var(--space-3) 0;
  }

  .entry-date {
    font-weight: 600;
    margin-bottom: var(--space-1);
  }

  .entry-attendees {
    font-size: 0.85rem;
    color: var(--color-muted);
    margin-bottom: var(--space-2);
  }

  .entry-section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--color-muted);
    margin: var(--space-2) 0 var(--space-1);
  }

  .entry-section-label:first-of-type { margin-top: 0; }

  .card ul {
    margin: 0;
    padding-left: var(--space-4);
    font-size: 0.9rem;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    margin-top: var(--space-2);
  }

  .tag {
    display: inline-block;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: 2px var(--space-2);
    font-size: 0.75rem;
    color: var(--color-text);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .board-column h2 {
    font-size: 0.9rem;
    margin: 0 0 var(--space-2);
    padding-bottom: var(--space-1);
    border-bottom: 3px solid var(--column-color, var(--color-border));
  }

  .board-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--column-color, var(--color-border));
    border-radius: 6px;
    padding: var(--space-2);
    margin-bottom: var(--space-2);
    font-size: 0.85rem;
    cursor: pointer;
  }

  .board-card .action-title {
    font-weight: 600;
    margin-bottom: var(--space-1);
  }

  .board-card .action-meta {
    color: var(--color-muted);
    font-size: 0.78rem;
  }

  .action-evidence-toggle {
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }

  .expand-indicator {
    display: inline-block;
    font-size: 0.7rem;
    transition: transform 0.15s ease;
  }

  .board-card.expanded .expand-indicator {
    transform: rotate(180deg);
  }

  .action-evidence-detail {
    display: none;
  }

  .board-card.expanded .action-evidence-detail {
    display: block;
    margin-top: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px solid var(--color-border);
  }

  .evidence-list {
    margin: 0;
    padding-left: var(--space-3);
    font-size: 0.78rem;
    color: var(--color-text);
  }

  .evidence-list li {
    margin-bottom: var(--space-1);
  }

  .evidence-close {
    display: none;
    margin-top: var(--space-2);
    padding: 2px var(--space-2);
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-muted);
    border-radius: 999px;
    font-size: 0.72rem;
    font-family: inherit;
    cursor: pointer;
  }

  .board-card.expanded .evidence-close {
    display: inline-block;
  }

  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="band">
  <div class="page-inner">
    <div class="header-brand">
      <img src="assets/careerpacer-icon.png" alt="CareerPacer logo">
      <h1>CareerPacer Dashboard</h1>
    </div>
    <div>
      <button type="button" class="refresh-button" id="refresh-button">Refresh data</button>
      <span id="load-status"></span>
    </div>
  </div>
</header>

<nav class="tabs band">
  <div class="page-inner">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="oneonones">1:1s</button>
    <button class="tab-btn" data-tab="idp-board">IDP Board</button>
  </div>
</nav>

<main>
  <div class="page-inner" id="main-inner">
  <section id="overview" class="tab-panel active">
    <div class="overview-section">
      <h2>Profile</h2>
      <div id="profile-header" class="profile-header"></div>
    </div>
    <div id="overview-warnings"></div>
    <div class="overview-section">
      <h2>1:1s</h2>
      <div id="overview-stats-oneonones" class="stats-grid"></div>
    </div>
    <div class="overview-section">
      <h2>IDP</h2>
      <div id="overview-stats-idp" class="stats-grid"></div>
    </div>
    <div class="overview-section">
      <h2>Next 1:1 Prep</h2>
      <div id="overview-next-prep"></div>
    </div>
    <div class="overview-section">
      <h2>Recent Progress</h2>
      <div id="overview-recent-progress"></div>
    </div>
  </section>

  <section id="oneonones" class="tab-panel">
    <div class="tab-intro">
      <h2>1:1s</h2>
      <p class="tab-subtitle">A chronological log of your 1:1 conversations, most recent first.</p>
    </div>
    <div id="oneonones-list"></div>
  </section>

  <section id="idp-board" class="tab-panel">
    <div class="tab-intro">
      <h2>IDP Board</h2>
      <p class="tab-subtitle">Individual Development Plan goals, tracked by status.</p>
    </div>
    <div id="idp-board-columns" class="board"></div>
  </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="parser.js"></script>
<script>
(function () {
  'use strict';

  const STATUS_COLUMNS = ['not_started', 'in_progress', 'done', 'blocked'];
  const STATUS_LABELS = {
    not_started: 'Not Started',
    in_progress: 'In Progress',
    done: 'Done',
    blocked: 'Blocked',
  };

  /** @type {{ oneOnOnes: Object[], idpActions: Object[], errors: Array }} */
  let data = { oneOnOnes: [], idpActions: [], errors: [] };
  /** @type {Object|null} */
  let profile = null;

  const refreshButton = document.getElementById('refresh-button');
  const loadStatus = document.getElementById('load-status');

  async function loadData() {
    loadStatus.textContent = 'Loading...';
    try {
      [data, profile] = await Promise.all([
        CareerPacerParser.loadCareerPacerData(),
        CareerPacerParser.loadProfile(),
      ]);
      const errorNote = data.errors.length ? `, ${data.errors.length} error(s)` : '';
      loadStatus.textContent = `Loaded ${data.oneOnOnes.length} 1:1(s) and ${data.idpActions.length} IDP action(s)${errorNote}.`;
    } catch (err) {
      loadStatus.textContent = 'Failed to load data: ' + (err && err.message ? err.message : String(err));
      return;
    }

    renderAll();
  }

  refreshButton.addEventListener('click', loadData);

  // Auto-load on page load (requires being served over http(s), e.g. `npx serve`
  // from the repo root — fetch() of local files is blocked under file://).
  loadData();

  // --- Tab switching ---

  const mainInner = document.getElementById('main-inner');

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-panel').forEach((panel) => {
      panel.classList.toggle('active', panel.id === tabName);
    });
    mainInner.classList.toggle('wide', tabName === 'idp-board');
  }

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // --- Rendering ---

  function renderAll() {
    renderProfileHeader();
    renderOverview();
    renderOneOnOnes();
    renderIdpBoard();
  }

  function renderProfileHeader() {
    const el = document.getElementById('profile-header');
    if (!profile) {
      el.innerHTML = '';
      return;
    }

    const { name, role, company, manager } = profile;

    let roleAtCompany = '';
    if (role && company) roleAtCompany = `${role} at ${company}`;
    else if (role) roleAtCompany = role;
    else if (company) roleAtCompany = company;

    const rows = [];
    if (roleAtCompany) rows.push(escapeHtml(roleAtCompany));
    if (name) rows.push(`<span class="profile-label">Name:</span> ${escapeHtml(name)}`);
    if (manager) rows.push(`<span class="profile-label">Manager:</span> ${escapeHtml(manager)}`);

    el.innerHTML = rows.map((row) => `<div class="profile-row">${row}</div>`).join('');
  }

  function renderOverview() {
    const warningsEl = document.getElementById('overview-warnings');
    const oneOnOneStatsEl = document.getElementById('overview-stats-oneonones');
    const idpStatsEl = document.getElementById('overview-stats-idp');

    warningsEl.innerHTML = '';
    if (data.errors.length > 0) {
      const box = document.createElement('div');
      box.className = 'warning-box';
      const items = data.errors
        .map((e) => `<li><strong>${escapeHtml(e.file)}</strong>: ${escapeHtml(e.message)}</li>`)
        .join('');
      box.innerHTML = `<h3>${data.errors.length} file(s) could not be parsed</h3><ul>${items}</ul>`;
      warningsEl.appendChild(box);
    }

    const totalOneOnOnes = data.oneOnOnes.length;
    const mostRecentDate = data.oneOnOnes
      .map((o) => o.date)
      .filter(Boolean)
      .sort()
      .pop();

    const statusCounts = STATUS_COLUMNS.reduce((acc, status) => {
      acc[status] = 0;
      return acc;
    }, {});
    data.idpActions.forEach((action) => {
      if (Object.prototype.hasOwnProperty.call(statusCounts, action.status)) {
        statusCounts[action.status] += 1;
      }
    });

    const oneOnOneBoxes = [
      { value: totalOneOnOnes, label: 'Total' },
      { value: mostRecentDate || '—', label: 'Most Recent' },
    ];

    oneOnOneStatsEl.innerHTML = oneOnOneBoxes
      .map((b) => `<div class="stat-box"><div class="value">${escapeHtml(String(b.value))}</div><div class="label">${escapeHtml(b.label)}</div></div>`)
      .join('');

    idpStatsEl.innerHTML = STATUS_COLUMNS
      .map((status) => `
        <div class="stat-box status-accent" style="--column-color: var(--color-${status})">
          <div class="value">${escapeHtml(String(statusCounts[status]))}</div>
          <div class="label">${escapeHtml(STATUS_LABELS[status])}</div>
        </div>
      `)
      .join('');

    renderNextPrep();
    renderRecentProgress();
  }

  function renderNextPrep() {
    const el = document.getElementById('overview-next-prep');
    const draft = data.oneOnOnes.find((o) => o.status === 'draft');

    if (!draft) {
      el.innerHTML = '<p class="empty-state">No draft prepared yet — ask the Skill to prep your next 1:1.</p>';
      return;
    }

    el.innerHTML = renderOneOnOneCard(draft);
  }

  function getRecentEvidence(limit) {
    const EVIDENCE_RE = /^\[(\d{4}-\d{2}-\d{2})\]\s*(.*)$/;
    const entries = [];

    data.idpActions.forEach((action) => {
      (action.linked_evidence || []).forEach((raw) => {
        const match = EVIDENCE_RE.exec(raw);
        if (match) {
          entries.push({ date: match[1], text: match[2] });
        }
      });
    });

    entries.sort((a, b) => b.date.localeCompare(a.date));
    return entries.slice(0, limit);
  }

  function renderRecentProgress() {
    const el = document.getElementById('overview-recent-progress');
    const entries = getRecentEvidence(3);

    if (entries.length === 0) {
      el.innerHTML = '<p class="empty-state">No IDP progress recorded yet.</p>';
      return;
    }

    el.innerHTML = `<ul class="recent-progress-list">${entries
      .map((e) => `<li><span class="entry-date-inline">${escapeHtml(e.date)}</span> — ${escapeHtml(e.text)}</li>`)
      .join('')}</ul>`;
  }

  function renderOneOnOnes() {
    const listEl = document.getElementById('oneonones-list');

    if (data.oneOnOnes.length === 0) {
      listEl.innerHTML = '<p class="empty-state">No 1:1s found. Make sure data/index.json is up to date (run scripts/generate-manifest.js after adding/editing files) and click "Refresh data" above.</p>';
      return;
    }

    const sorted = [...data.oneOnOnes].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    listEl.innerHTML = sorted.map((entry) => renderOneOnOneCard(entry)).join('');
  }

  function renderOneOnOneCard(entry) {
    const attendees = (entry.attendees || []).join(', ') || 'No attendees recorded';
    const discussionParagraphs = (entry.body || '')
      .split(/\n\s*\n/)
      .map((p) => p.replace(/\s+/g, ' ').trim())
      .filter(Boolean);

    const discussionHtml = discussionParagraphs.length
      ? `<div class="entry-section-label">Discussion</div><ul>${discussionParagraphs.map((p) => `<li>${escapeHtml(p)}</li>`).join('')}</ul>`
      : '';

    const followUpsHtml = (entry.follow_ups || []).length
      ? `<div class="entry-section-label">Follow-ups</div><ul>${entry.follow_ups.map((f) => `<li>${escapeHtml(f)}</li>`).join('')}</ul>`
      : '';

    const linkedActionsHtml = (entry.linked_actions || []).length
      ? `<div class="tags">${entry.linked_actions.map((id) => `<span class="tag">${escapeHtml(actionLabel(id))}</span>`).join('')}</div>`
      : '';

    return `
      <div class="card">
        <div class="entry-date">${escapeHtml(entry.date || 'Unknown date')}</div>
        <div class="entry-attendees">${escapeHtml(attendees)}</div>
        ${discussionHtml}
        ${followUpsHtml}
        ${linkedActionsHtml}
      </div>
    `;
  }

  function actionLabel(id) {
    const match = data.idpActions.find((a) => a.id === id);
    return match ? match.title : id;
  }

  function renderIdpBoard() {
    const columnsEl = document.getElementById('idp-board-columns');

    columnsEl.innerHTML = STATUS_COLUMNS.map((status) => {
      const actions = data.idpActions.filter((a) => a.status === status);
      const cardsHtml = actions.length
        ? actions.map((a) => renderIdpCard(a)).join('')
        : '<p class="empty-state">No actions.</p>';

      return `
        <div class="board-column" style="--column-color: var(--color-${status})">
          <h2>${STATUS_LABELS[status]} (${actions.length})</h2>
          ${cardsHtml}
        </div>
      `;
    }).join('');
  }

  function renderIdpCard(action) {
    const evidence = action.linked_evidence || [];
    const evidenceCount = evidence.length;
    const evidenceLabel = evidenceCount === 1 ? '1 evidence entry' : `${evidenceCount} evidence entries`;
    const targetDate = action.target_date || 'no target date';

    const evidenceListHtml = evidence.length
      ? `<ul class="evidence-list">${evidence.map((e) => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`
      : '<p class="empty-state">No evidence logged yet.</p>';

    return `
      <div class="board-card">
        <div class="action-title">${escapeHtml(action.title || action.id)}</div>
        <div class="action-meta">Target: ${escapeHtml(targetDate)}</div>
        <div class="action-meta action-evidence-toggle">${escapeHtml(evidenceLabel)} <span class="expand-indicator">&#9662;</span></div>
        <div class="action-evidence-detail">
          ${evidenceListHtml}
          <button type="button" class="evidence-close">Collapse &#9652;</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Expand/collapse an IDP card's full evidence list on click (event
  // delegation, since #idp-board-columns's innerHTML is replaced on every
  // render).
  document.getElementById('idp-board-columns').addEventListener('click', (event) => {
    const card = event.target.closest('.board-card');
    if (!card) return;
    card.classList.toggle('expanded');
  });

  // Initial empty-state render
  renderAll();
})();
</script>

</body>
</html>
